{% extends 'base.html' %}
{% block content %}
<h2>취미 선택</h2>

<form method="GET">
    <input type="checkbox" name="hobby" value="게임"> 게임 <br>
    <input type="checkbox" name="hobby" value="운동"> 운동 <br>
    <input type="checkbox" name="hobby" value="독서"> 독서 <br>
    <input type="checkbox" name="hobby" value="코딩"> 코딩 <br>

    <button type="submit">전송</button>
</form>

<hr>
<h3>선택한 취미</h3>
<ul>
    {% for h in hobbies %}
        <li>{{ loop.index }}. {{ h }}</li>
    {% endfor %}
</ul>

{% endblock %}
