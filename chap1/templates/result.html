<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    {% if username == 'admin'%}
        <h2> 관리자 입니다. </h2>
    {% else %}
        <h2>{{username}}님. 환영합니다.</h2>
    {% endif %}

    <h3>유저 목록</h3>
    {% for user in users %}
        <p>{{ loop.index }}. {{ user }}</p>
    {% endfor %}
</body>
</html>
